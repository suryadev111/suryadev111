name: Generate GitHub Profile Analytics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: suryadev111
          filename: github-stats.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large
          output_action: commit
          committer_message: "chore: update GitHub overview [Skip GitHub Action]"

      - name: Generate most-used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: suryadev111
          filename: top-languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_message: "chore: update language statistics [Skip GitHub Action]"

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: suryadev111
          filename: contribution-calendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_message: "chore: update contribution calendar [Skip GitHub Action]"

      - name: Generate achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: suryadev111
          filename: achievements.svg
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_message: "chore: update GitHub achievements [Skip GitHub Action]"
