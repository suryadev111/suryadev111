
name: Generate GitHub Profile Analytics

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: github-profile-analytics
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Profile Analytics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. GitHub Statistics
      - name: Generate GitHub Statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: suryadev111
          filename: github-stats.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large
          config_output: svg
          output_action: commit

      # 2. Most Used Programming Languages
      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: suryadev111
          filename: top-languages.svg
          template: classic
          base: ""
          config_output: svg
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          output_action: commit

      # 3. Contribution Calendar
      - name: Generate Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: suryadev111
          filename: contribution-calendar.svg
          template: classic
          base: ""
          config_output: svg
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_timezone: Asia/Kolkata
          output_action: commit
