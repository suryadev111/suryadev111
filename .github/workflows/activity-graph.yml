
name: Generate Contribution Activity Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-activity-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Activity Graph
        run: python .github/scripts/generate_activity_graph.py

      - name: Commit Activity Graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity-graph.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update contribution activity graph"
            git push
          else
            echo "Activity graph is already up to date."
          fi
